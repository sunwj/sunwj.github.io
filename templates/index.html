<button id="back_top" type="button" aria-label="Back to top">↑</button>
<script>
const backTop = document.getElementById('back_top');
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
window.addEventListener('scroll', () => {
  backTop.classList.toggle('visible', window.scrollY > 400);
  if (window.scrollY < 100) {
    document.querySelectorAll('.staffshortcut a').forEach(link => {
      link.classList.remove('active');
      link.removeAttribute('aria-current');
    });
  }
}, { passive: true });
backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: reducedMotion.matches ? 'instant' : 'smooth' }));
const navLinks = [...document.querySelectorAll('.staffshortcut a')];
if ('IntersectionObserver' in window) {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting && window.scrollY >= 100) {
        navLinks.forEach(link => {
          const active = link.getAttribute('href') === '#' + entry.target.id;
          link.classList.toggle('active', active);
          if (active) link.setAttribute('aria-current', 'location');
          else link.removeAttribute('aria-current');
        });
      }
    });
  }, { rootMargin: '-10% 0px -65% 0px', threshold: 0 });
  document.querySelectorAll('main > section').forEach(section => observer.observe(section));
}
</script>
